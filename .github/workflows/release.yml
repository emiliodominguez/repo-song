name: Release

# Push a tag like v0.2.0 (matching package.json) to publish to npm with provenance. See docs/releasing.md.
on:
    push:
        tags: ["v*"]

permissions:
    contents: write # the GitHub release
    id-token: write # npm provenance and trusted publishing

jobs:
    publish:
        runs-on: ubuntu-latest
        environment: npm
        steps:
            - uses: actions/checkout@v5
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v5
              with:
                  node-version-file: .node-version
                  cache: pnpm
                  registry-url: https://registry.npmjs.org
            - run: pnpm install --frozen-lockfile
            - name: Tag matches package.json
              run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
            - run: pnpm check
            - run: npm publish --provenance --access public
              env:
                  # unused once trusted publishing is configured on npmjs.com; an automation token until then
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
            - run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
              env:
                  GH_TOKEN: ${{ github.token }}
